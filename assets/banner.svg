<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#primaryGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }
    .stream-line {
      stroke-dasharray: 10, 15;
      animation: streamFlow 25s linear infinite;
    }
    @keyframes streamFlow {
      from { stroke-dashoffset: 500; }
      to { stroke-dashoffset: 0; }
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 5px; opacity: 0.4; }
      100% { r: 8px; opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="260" rx="16" fill="url(#grid)" />

  <!-- Animated Stream Lines in Background (Depth layer) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 200 C 300 240, 500 160, 750 210 C 900 240, 1050 180, 1150 200" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="stream-line" d="M 50 70 C 350 40, 600 100, 850 50 C 1000 20, 1100 80, 1150 60" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="280" cy="80" class="pulse-node" fill="#818cf8" filter="url(#glow)" />
    <circle cx="850" cy="190" class="pulse-node" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="70" class="pulse-node" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Modern Top Status Badge -->
  <g transform="translate(60, 36)">
    <rect width="210" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="18.5" class="badge-pill-text">CHANGE DATA CAPTURE</text>
  </g>

  <!-- Main Hero Titles (Clean Foreground) -->
  <g transform="translate(60, 110)">
    <text class="title-text">Awesome Change Data Capture (CDC)</text>
    <text y="38" class="subtitle-text">Curated Log-Based Replication Engines, Streaming Pipelines, Lakehouses &amp; Enterprise Platforms</text>
  </g>

  <!-- Interactive Data Pipeline Badges at Bottom -->
  <g transform="translate(60, 195)">
    <!-- Source DB Tag -->
    <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="65" y="21.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🗄️ Source DBs</text>

    <!-- Connector Flow Arrow -->
    <path d="M 142 17 L 175 17" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3" />

    <!-- CDC Engine Tag -->
    <rect x="185" width="160" height="34" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="265" y="21.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">⚡ Real-Time Log CDC</text>

    <!-- Connector Flow Arrow -->
    <path d="M 357 17 L 390 17" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Event Bus Tag -->
    <rect x="400" width="165" height="34" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
    <text x="482" y="21.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">🌊 Streaming / Kafka</text>

    <!-- Connector Flow Arrow -->
    <path d="M 577 17 L 610 17" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Sink Destination Tag -->
    <rect x="620" width="165" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="702" y="21.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">❄️ Lakehouse / Warehouses</text>
  </g>
</svg>
